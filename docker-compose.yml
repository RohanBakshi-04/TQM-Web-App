version: '3.8'

services:
  hostel-web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostel-management-system
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_NAME=Hostel Management System Web App
      - APP_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - DATABASE_PATH=data/hostel_web.db
      - ENABLE_SQLITE_WAL=True
      - ENABLE_DEMO_SEEDING=False
    volumes:
      - hostel_data:/app/data
      - hostel_backups:/app/data/backups
      - hostel_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hostel_data:
  hostel_backups:
  hostel_uploads:
