version: '3.8'

services:
  hostel-web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostel-management-system
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Hostel Management System Web App
      - APP_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - SECRET_KEY=prod_super_secret_jwt_signing_key_replace_me_randomly_12345
      - DATABASE_PATH=data/hostel_web.db
      - ENABLE_SQLITE_WAL=True
    volumes:
      - hostel_data:/app/data
      - hostel_backups:/app/data/backups
      - hostel_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hostel_data:
  hostel_backups:
  hostel_uploads:
